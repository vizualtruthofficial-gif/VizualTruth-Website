<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | VizualTruth</title>
  <meta name="description" content="VizualTruth game image gallery organized by game.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="Assets/Logo/vizualtruth-favicon.png">
  <script>
    try {
      if (window.localStorage.getItem("vizualtruth-theme") === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    } catch (error) {}
  </script>
  <style>
    html.dark-mode,
    html.dark-mode body {
      background: #0b0d10;
      color: #f5f8fa;
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header navbar navbar-expand-sm">
    <div class="container nav-shell">
      <a class="navbar-brand brand-link" href="index.html" aria-label="VizualTruth home">
        <span class="logo-tile">
          <img src="Assets/Logo/VizualTruth%20Logo.jpg" alt="VizualTruth logo">
        </span>
        <span class="brand-word">VizualTruth</span>
      </a>
      <nav class="nav nav-pills top-tabs" aria-label="Main navigation">
        <a class="nav-link" href="index.html#games">Games</a>
        <a class="nav-link" href="index.html#merch">Merch</a>
        <a class="nav-link active" href="gallery.html">Gallery</a>
        <a class="nav-link" href="index.html#contact">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
        <span class="moon-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="container gallery-hero" aria-labelledby="gallery-title">
      <p class="eyebrow">Game media</p>
      <h1 id="gallery-title">Gallery</h1>
      <p class="lead">Artwork, character sheets, and development images grouped by VizualTruth game.</p>
    </section>

    <section class="container gallery-section" aria-labelledby="night-inn-gallery">
      <div class="gallery-game-heading">
        <p class="eyebrow">Psychological horror</p>
        <h2 id="night-inn-gallery">Night Inn</h2>
      </div>

      <div class="gallery-grid">
        <figure class="gallery-item">
          <a href="Assets/Games/Night-Inn/night-inn-title.png">
            <img src="Assets/Games/Night-Inn/night-inn-title.png" alt="Night Inn title artwork">
          </a>
          <figcaption>Title Artwork</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="Assets/Games/Night-Inn/night-inn-description.png">
            <img src="Assets/Games/Night-Inn/night-inn-description.png" alt="Night Inn description artwork">
          </a>
          <figcaption>Description Artwork</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="Assets/Games/Night-Inn/night-inn-amy.png">
            <img src="Assets/Games/Night-Inn/night-inn-amy.png" alt="Amy character artwork">
          </a>
          <figcaption>Amy Character Sheet</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="Assets/Games/Night-Inn/night-inn-amy-trick.png">
            <img src="Assets/Games/Night-Inn/night-inn-amy-trick.png" alt="Amy trick artwork">
          </a>
          <figcaption>Amy Trick Artwork</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="Assets/Games/Night-Inn/night-inn-amy-treat.png">
            <img src="Assets/Games/Night-Inn/night-inn-amy-treat.png" alt="Amy treat artwork">
          </a>
          <figcaption>Amy Treat Artwork</figcaption>
        </figure>
        <figure class="gallery-item">
          <a href="Assets/Games/Night-Inn/night-inn-sketch.png">
            <img src="Assets/Games/Night-Inn/night-inn-sketch.png" alt="Night Inn sketch artwork">
          </a>
          <figcaption>Development Sketch</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>VizualTruth - 2026 - 1.7</p>
  </footer>
  <script src="theme.js"></script>
</body>
</html>
